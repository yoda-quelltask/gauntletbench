<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Audio (WebAudio only) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, duration, type, volume, slideTo) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + duration);
    gain.gain.setValueAtTime(volume || 0.08, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }
  const sfx = {
    shoot:   () => beep(880, 0.08, "square", 0.05, 220),
    invader: () => beep(160, 0.12, "sawtooth", 0.06, 60),
    hit:     () => beep(300, 0.15, "square", 0.07, 80),
    playerHit:() => beep(120, 0.4, "sawtooth", 0.1, 30),
    wave:    () => { beep(440, 0.1, "square", 0.06); setTimeout(() => beep(660, 0.1, "square", 0.06), 110); setTimeout(() => beep(880, 0.15, "square", 0.06), 220); }
  };

  // ---------- Input ----------
  const keys = {};
  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    ensureAudio();
    if ((e.key === "Enter" || e.key === " ") && (state === "gameover" || state === "start")) {
      startGame();
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });
  canvas.addEventListener("mousedown", () => {
    ensureAudio();
    if (state === "gameover" || state === "start") startGame();
  });

  // ---------- Game state ----------
  const ROWS = 5;
  const COLS = 10;
  let state = "start"; // start | playing | gameover
  let score = 0;
  let lives = 3;
  let wave = 1;

  let player, bullets, enemyBullets, invaders, particles;
  let invaderDir, invaderMoveTimer, invaderMoveInterval, invaderFireTimer;
  let playerFireCooldown = 0;
  let invaderAnimFrame = 0, invaderAnimTimer = 0;
  let waveTransitionTimer = 0;
  let shakeTime = 0;

  function makeInvaders() {
    invaders = [];
    const marginX = Math.max(60, W * 0.08);
    const spacingX = (W - marginX * 2) / COLS;
    const spacingY = Math.min(48, H * 0.05);
    const topY = Math.max(70, H * 0.12);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        invaders.push({
          x: marginX + spacingX * (c + 0.5),
          y: topY + spacingY * r,
          w: Math.min(34, spacingX * 0.7),
          h: Math.min(24, spacingY * 0.6),
          row: r,
          alive: true
        });
      }
    }
  }

  function startGame() {
    score = 0;
    lives = 3;
    wave = 1;
    startWave();
    state = "playing";
  }

  function startWave() {
    bullets = [];
    enemyBullets = [];
    particles = [];
    makeInvaders();
    invaderDir = 1;
    invaderMoveTimer = 0;
    invaderMoveInterval = Math.max(0.08, 0.55 - (wave - 1) * 0.06);
    invaderFireTimer = 1.5;
    playerFireCooldown = 0;
    invaderAnimFrame = 0;
    invaderAnimTimer = 0;
    player = {
      x: W / 2,
      y: H - 70,
      w: 44,
      h: 22,
      speed: 420,
      invuln: 1.2
    };
    sfx.wave();
  }

  // ---------- Helpers ----------
  function aliveCount() {
    let n = 0;
    for (const inv of invaders) if (inv.alive) n++;
    return n;
  }

  function rectsOverlap(a, b) {
    return a.x - a.w / 2 < b.x + b.w / 2 &&
           a.x + a.w / 2 > b.x - b.w / 2 &&
           a.y - a.h / 2 < b.y + b.h / 2 &&
           a.y + a.h / 2 > b.y - b.h / 2;
  }

  function spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 160;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color
      });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (state !== "playing") return;

    // Player movement
    if (keys["ArrowLeft"]) player.x -= player.speed * dt;
    if (keys["ArrowRight"]) player.x += player.speed * dt;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
    if (player.invuln > 0) player.invuln -= dt;

    // Player fire
    playerFireCooldown -= dt;
    if (keys[" "] && playerFireCooldown <= 0) {
      bullets.push({ x: player.x, y: player.y - player.h / 2 - 6, w: 4, h: 14, vy: -620 });
      playerFireCooldown = 0.28;
      sfx.shoot();
    }

    // Bullets
    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter(b => b.y > -20);

    for (const b of enemyBullets) b.y += b.vy * dt;
    enemyBullets = enemyBullets.filter(b => b.y < H + 20);

    // Invader marching
    const alive = aliveCount();
    const total = ROWS * COLS;
    const speedFactor = 1 + (1 - alive / total) * 2.2; // up to 3.2x faster
    const stepInterval = invaderMoveInterval / speedFactor;
    invaderMoveTimer += dt;

    // Animation frame
    invaderAnimTimer += dt;
    if (invaderAnimTimer > 0.35) {
      invaderAnimTimer = 0;
      invaderAnimFrame = 1 - invaderAnimFrame;
    }

    if (invaderMoveTimer >= stepInterval) {
      invaderMoveTimer = 0;
      const stepX = 16;
      const stepY = 22;
      let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const inv of invaders) {
        if (!inv.alive) continue;
        minX = Math.min(minX, inv.x);
        maxX = Math.max(maxX, inv.x);
        maxY = Math.max(maxY, inv.y);
      }
      if (minX === Infinity) return; // no invaders

      const hitEdge = (invaderDir > 0 && maxX + stepX > W - 20) ||
                      (invaderDir < 0 && minX - stepX < 20);
      if (hitEdge) {
        invaderDir *= -1;
        for (const inv of invaders) if (inv.alive) inv.y += stepY;
      } else {
        for (const inv of invaders) if (inv.alive) inv.x += stepX * invaderDir;
      }

      // Reached player level?
      if (maxY + 12 >= player.y - player.h / 2) {
        lives = 0;
        gameOver();
        return;
      }
    }

    // Invader firing
    invaderFireTimer -= dt;
    if (invaderFireTimer <= 0 && alive > 0) {
      // pick a random alive invader, prefer bottom of each column
      const candidates = [];
      for (const inv of invaders) if (inv.alive) candidates.push(inv);
      const shooter = candidates[Math.floor(Math.random() * candidates.length)];
      const fireRate = Math.max(0.25, 1.1 - (wave - 1) * 0.08);
      invaderFireTimer = fireRate * (0.5 + Math.random());
      enemyBullets.push({ x: shooter.x, y: shooter.y + shooter.h / 2 + 6, w: 4, h: 12, vy: 260 + wave * 20 });
      beep(220, 0.07, "triangle", 0.04, 110);
    }

    // Collisions: player bullets vs invaders
    for (const b of bullets) {
      if (b.dead) continue;
      for (const inv of invaders) {
        if (!inv.alive) continue;
        if (rectsOverlap(b, inv)) {
          inv.alive = false;
          b.dead = true;
          score += 10 + (ROWS - 1 - inv.row) * 5;
          spawnExplosion(inv.x, inv.y, "#4dff88", 14);
          sfx.hit();
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);

    // Collisions: enemy bullets vs player
    if (player.invuln <= 0) {
      for (const b of enemyBullets) {
        if (b.dead) continue;
        if (rectsOverlap(b, player)) {
          b.dead = true;
          lives--;
          player.invuln = 1.5;
          shakeTime = 0.3;
          spawnExplosion(player.x, player.y, "#ff5555", 24);
          sfx.playerHit();
          if (lives <= 0) {
            gameOver();
            return;
          }
          break;
        }
      }
      enemyBullets = enemyBullets.filter(b => !b.dead);
    }

    // Particles
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    if (shakeTime > 0) shakeTime -= dt;

    // Wave cleared
    if (aliveCount() === 0) {
      wave++;
      startWave();
    }
  }

  function gameOver() {
    state = "gameover";
    sfx.playerHit();
  }

  // ---------- Drawing ----------
  function drawInvader(inv) {
    const x = inv.x, y = inv.y, w = inv.w, h = inv.h;
    const colors = ["#ff5577", "#ffaa33", "#ffee44", "#44ffcc", "#88aaff"];
    ctx.fillStyle = colors[inv.row % colors.length];
    const f = invaderAnimFrame;
    const u = w / 8, v = h / 6;
    // body
    ctx.fillRect(x - 3 * u, y - 2 * v, 6 * u, 3 * v);
    // head
    ctx.fillRect(x - 2 * u, y - 3 * v, 4 * u, v);
    // eyes
    ctx.fillStyle = "#000";
    ctx.fillRect(x - 1.5 * u, y - 2.5 * v, u, v);
    ctx.fillRect(x + 0.5 * u, y - 2.5 * v, u, v);
    ctx.fillStyle = colors[inv.row % colors.length];
    // legs
    if (f === 0) {
      ctx.fillRect(x - 3 * u, y + v, u, v);
      ctx.fillRect(x + 2 * u, y + v, u, v);
      ctx.fillRect(x - 2 * u, y + 2 * v, u, v);
      ctx.fillRect(x + u, y + 2 * v, u, v);
    } else {
      ctx.fillRect(x - 2.5 * u, y + v, u, v);
      ctx.fillRect(x + 1.5 * u, y + v, u, v);
      ctx.fillRect(x - 1.5 * u, y + 2 * v, u, v);
      ctx.fillRect(x + 0.5 * u, y + 2 * v, u, v);
    }
    // arms
    ctx.fillRect(x - 4 * u, y - v, u, 2 * v);
    ctx.fillRect(x + 3 * u, y - v, u, 2 * v);
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) return; // blink
    const x = player.x, y = player.y, w = player.w, h = player.h;
    ctx.fillStyle = "#44ddff";
    ctx.fillRect(x - w / 2, y + h * 0.1, w, h * 0.4);
    ctx.fillRect(x - w * 0.3, y - h * 0.2, w * 0.6, h * 0.35);
    ctx.fillRect(x - w * 0.12, y - h * 0.6, w * 0.24, h * 0.45);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - w * 0.08, y - h * 0.55, w * 0.16, h * 0.2);
  }

  function drawHUD() {
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 20, 32);
    ctx.textAlign = "center";
    ctx.fillText("WAVE " + wave, W / 2, 32);
    ctx.textAlign = "right";
    let livesStr = "";
    for (let i = 0; i < lives; i++) livesStr += "▲ ";
    ctx.fillText("LIVES " + livesStr, W - 20, 32);
  }

  function drawStars() {
    // static pseudo-random stars based on index
    ctx.fillStyle = "#334";
    for (let i = 0; i < 80; i++) {
      const sx = ((i * 137.5) % W);
      const sy = ((i * 89.3) % (H - 100)) + 50;
      const s = (i % 3) + 1;
      ctx.fillRect(sx, sy, s, s);
    }
  }

  function draw() {
    ctx.save();
    if (shakeTime > 0) {
      ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    }
    ctx.fillStyle = "#000";
    ctx.fillRect(-20, -20, W + 40, H + 40);
    drawStars();

    if (state === "start") {
      ctx.fillStyle = "#4dff88";
      ctx.font = "bold 48px monospace";
      ctx.textAlign = "center";
      ctx.fillText("SPACE INVADERS", W / 2, H / 2 - 60);
      ctx.fillStyle = "#ffffff";
      ctx.font = "20px monospace";
      ctx.fillText("ARROW KEYS to move  |  SPACE to fire", W / 2, H / 2);
      ctx.fillText("Press SPACE or CLICK to start", W / 2, H / 2 + 40);
      ctx.restore();
      return;
    }

    // Invaders
    for (const inv of invaders) if (inv.alive) drawInvader(inv);

    // Player
    if (state === "playing") drawPlayer();

    // Bullets
    ctx.fillStyle = "#ffffff";
    for (const b of bullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fillStyle = "#ff8844";
    for (const b of enemyBullets) ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    drawHUD();

    if (state === "gameover") {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff5555";
      ctx.font = "bold 56px monospace";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 50);
      ctx.fillStyle = "#ffffff";
      ctx.font = "28px monospace";
      ctx.fillText("FINAL SCORE: " + score, W / 2, H / 2 + 10);
      ctx.font = "20px monospace";
      ctx.fillText("Reached wave " + wave, W / 2, H / 2 + 50);
      ctx.fillText("Press SPACE / ENTER or CLICK to restart", W / 2, H / 2 + 100);
    }
    ctx.restore();
  }

  // ---------- Main loop (requestAnimationFrame only) ----------
  let lastTime = performance.now();
  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1; // clamp big frame gaps
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
