<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloth Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; }
#hint {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.7);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  background: rgba(0,0,0,0.5);
  padding: 10px 20px;
  border-radius: 8px;
  pointer-events: none;
  text-align: center;
  line-height: 1.6;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.1);
}
#hint span { color: #64ffda; font-weight: 600; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">
  <span>Left-click + drag</span> to pull cloth &nbsp;·&nbsp;
  <span>Right-click + drag</span> to tear &nbsp;·&nbsp;
  <span>Scroll</span> to adjust tear threshold
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const COLS = 40;
const ROWS = 28;
const SPACING = 18;
const GRAVITY = 0.45;
const DAMPING = 0.985;
const CONSTRAINT_ITERATIONS = 8;
const TEAR_THRESHOLD_MULT = 2.2;
const MOUSE_RADIUS = 30;
const MOUSE_FORCE = 0.9;

let tearThreshold = TEAR_THRESHOLD_MULT;

// --- Point ---
class Point {
  constructor(x, y, pinned) {
    this.x = x;
    this.y = y;
    this.oldX = x;
    this.oldY = y;
    this.pinned = pinned;
  }
}

// --- Constraint ---
class Constraint {
  constructor(p1, p2) {
    this.p1 = p1;
    this.p2 = p2;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    this.restLength = Math.sqrt(dx * dx + dy * dy);
    this.broken = false;
  }
}

// --- Build mesh ---
let points = [];
let constraints = [];

function buildMesh() {
  points = [];
  constraints = [];

  const offsetX = (W - (COLS - 1) * SPACING) / 2;
  const offsetY = 60;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const x = offsetX + col * SPACING;
      const y = offsetY + row * SPACING;
      const pinned = row === 0;
      points.push(new Point(x, y, pinned));
    }
  }

  // Horizontal constraints
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS - 1; col++) {
      const i = row * COLS + col;
      constraints.push(new Constraint(points[i], points[i + 1]));
    }
  }

  // Vertical constraints
  for (let row = 0; row < ROWS - 1; row++) {
    for (let col = 0; col < COLS; col++) {
      const i = row * COLS + col;
      constraints.push(new Constraint(points[i], points[i + COLS]));
    }
  }

  // Diagonal constraints for shear resistance
  for (let row = 0; row < ROWS - 1; row++) {
    for (let col = 0; col < COLS - 1; col++) {
      const i = row * COLS + col;
      constraints.push(new Constraint(points[i], points[i + COLS + 1]));
      constraints.push(new Constraint(points[i + 1], points[i + COLS]));
    }
  }
}

buildMesh();

// --- Mouse state ---
let mouse = { x: 0, y: 0, down: false, rightDown: false, draggedPoint: null };
let mouseDownPos = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouseDownPos.x = e.clientX;
  mouseDownPos.y = e.clientY;
  if (e.button === 0) {
    mouse.down = true;
    // Find nearest point within radius
    let nearest = null;
    let nearestDist = MOUSE_RADIUS;
    for (const p of points) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < nearestDist) {
        nearestDist = d;
        nearest = p;
      }
    }
    mouse.draggedPoint = nearest;
  } else if (e.button === 2) {
    mouse.rightDown = true;
  }
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;

  if (mouse.rightDown) {
    // Tear constraints near cursor
    for (const c of constraints) {
      if (c.broken) continue;
      const midX = (c.p1.x + c.p2.x) / 2;
      const midY = (c.p1.y + c.p2.y) / 2;
      const dx = midX - mouse.x;
      const dy = midY - mouse.y;
      if (dx * dx + dy * dy < MOUSE_RADIUS * MOUSE_RADIUS) {
        c.broken = true;
      }
    }
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0) {
    mouse.down = false;
    mouse.draggedPoint = null;
  } else if (e.button === 2) {
    mouse.rightDown = false;
  }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  tearThreshold = Math.max(1.2, Math.min(5.0, tearThreshold - e.deltaY * 0.001));
});

// --- Physics ---
function simulate() {
  const dt = 1.0;

  // Verlet integration
  for (const p of points) {
    if (p.pinned) continue;

    const vx = (p.x - p.oldX) * DAMPING;
    const vy = (p.y - p.oldY) * DAMPING;

    p.oldX = p.x;
    p.oldY = p.y;

    p.x += vx;
    p.y += vy + GRAVITY * dt * dt;

    // Air drag (additional damping on velocity)
    // Already handled by DAMPING factor above
  }

  // Mouse drag
  if (mouse.down && mouse.draggedPoint) {
    const targetX = mouse.x;
    const targetY = mouse.y;
    const dx = targetX - mouse.draggedPoint.x;
    const dy = targetY - mouse.draggedPoint.y;
    mouse.draggedPoint.x += dx * MOUSE_FORCE;
    mouse.draggedPoint.y += dy * MOUSE_FORCE;
    // Also drag nearby points for a more natural feel
    for (const p of points) {
      if (p === mouse.draggedPoint || p.pinned) continue;
      const ddx = p.x - mouse.x;
      const ddy = p.y - mouse.y;
      const dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist < MOUSE_RADIUS * 2 && dist > 0) {
        const influence = (1 - dist / (MOUSE_RADIUS * 2)) * MOUSE_FORCE * 0.3;
        p.x += (targetX - p.x) * influence * 0.1;
        p.y += (targetY - p.y) * influence * 0.1;
      }
    }
  }

  // Constraint relaxation
  for (let iter = 0; iter < CONSTRAINT_ITERATIONS; iter++) {
    for (const c of constraints) {
      if (c.broken) continue;

      const dx = c.p2.x - c.p1.x;
      const dy = c.p2.y - c.p1.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist === 0) continue;

      // Auto-tear
      if (dist > c.restLength * tearThreshold) {
        c.broken = true;
        continue;
      }

      const diff = (dist - c.restLength) / dist * 0.5;
      const offsetX = dx * diff;
      const offsetY = dy * diff;

      if (!c.p1.pinned) {
        c.p1.x += offsetX;
        c.p1.y += offsetY;
      }
      if (!c.p2.pinned) {
        c.p2.x -= offsetX;
        c.p2.y -= offsetY;
      }
    }
  }

  // Boundary: keep points on screen (soft)
  for (const p of points) {
    if (p.pinned) continue;
    if (p.x < 0) { p.x = 0; p.oldX = p.x; }
    if (p.x > W) { p.x = W; p.oldX = p.x; }
    if (p.y > H) { p.y = H; p.oldY = p.y; }
    if (p.y < 0) { p.y = 0; p.oldY = p.y; }
  }
}

// --- Rendering ---
function render() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#1a1a2e');
  bgGrad.addColorStop(1, '#16213e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Draw shaded quads
  for (let row = 0; row < ROWS - 1; row++) {
    for (let col = 0; col < COLS - 1; col++) {
      const i = row * COLS + col;
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + COLS + 1];
      const p4 = points[i + COLS];

      // Check if all 4 constraints exist and are unbroken
      const h1 = constraints.find(c => !c.broken && ((c.p1 === p1 && c.p2 === p2) || (c.p1 === p2 && c.p2 === p1)));
      const h2 = constraints.find(c => !c.broken && ((c.p1 === p4 && c.p2 === p3) || (c.p1 === p3 && c.p2 === p4)));
      const v1 = constraints.find(c => !c.broken && ((c.p1 === p1 && c.p2 === p4) || (c.p1 === p4 && c.p2 === p1)));
      const v2 = constraints.find(c => !c.broken && ((c.p1 === p2 && c.p2 === p3) || (c.p1 === p3 && c.p2 === p2)));

      if (!h1 || !h2 || !v1 || !v2) continue;

      // Compute average velocity for shading
      const avgVx = (p1.x - p1.oldX + p2.x - p2.oldX + p3.x - p3.oldX + p4.x - p4.oldX) / 4;
      const avgVy = (p1.y - p1.oldY + p2.y - p2.oldY + p3.y - p3.oldY + p4.y - p4.oldY) / 4;
      const speed = Math.sqrt(avgVx * avgVx + avgVy * avgVy);
      const t = Math.min(1, speed / 8);

      const r = Math.floor(30 + t * 80);
      const g = Math.floor(40 + t * 120);
      const b = Math.floor(80 + t * 100);
      const a = 0.6 + t * 0.3;

      ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Draw constraints as lines
  ctx.lineWidth = 0.8;
  for (const c of constraints) {
    if (c.broken) continue;

    const dx = c.p2.x - c.p1.x;
    const dy = c.p2.y - c.p1.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const stretch = dist / c.restLength;

    // Color based on stretch
    let r, g, b;
    if (stretch < 1.1) {
      r = 100; g = 200; b = 220;
    } else if (stretch < 1.5) {
      const t = (stretch - 1.1) / 0.4;
      r = Math.floor(100 + t * 155);
      g = Math.floor(200 - t * 50);
      b = Math.floor(220 - t * 150);
    } else {
      const t = Math.min(1, (stretch - 1.5) / 0.7);
      r = Math.floor(255);
      g = Math.floor(150 - t * 100);
      b = Math.floor(70 - t * 50);
    }

    ctx.strokeStyle = `rgba(${r},${g},${b},0.7)`;
    ctx.beginPath();
    ctx.moveTo(c.p1.x, c.p1.y);
    ctx.lineTo(c.p2.x, c.p2.y);
    ctx.stroke();
  }

  // Draw pinned points
  ctx.fillStyle = '#64ffda';
  for (const p of points) {
    if (p.pinned) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw mouse interaction indicator
  if (mouse.down && mouse.draggedPoint) {
    ctx.strokeStyle = 'rgba(100, 255, 218, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, MOUSE_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (mouse.rightDown) {
    ctx.strokeStyle = 'rgba(255, 80, 80, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, MOUSE_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Tear threshold indicator
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '12px monospace';
  ctx.fillText(`Tear threshold: ${tearThreshold.toFixed(1)}x`, 15, 25);
}

// --- Main loop ---
function loop() {
  simulate();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
