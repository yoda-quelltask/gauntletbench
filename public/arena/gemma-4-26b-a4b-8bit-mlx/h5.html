<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verlet Cloth Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="controls">
    Click and drag to interact with the cloth.
</div>
<canvas id="canvas"></canvas>

<script>
/**
 * VERLET CLOTH SIMULATION
 * A robust implementation using implicit velocity and constraint satisfaction.
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Configuration
const CONFIG = {
    gravity: 0.5,
    friction: 0.99, // Air resistance/damping
    iterations: 5,  // Constraint solver iterations (higher = stiffer cloth)
    spacing: 15,    // Distance between particles
    clothWidth: 40, // Number of particles wide
    clothHeight: 30,// Number of particles high
    mouseRadius: 25 // Interaction radius
};

let width, height;
let points = [];
let sticks = [];
let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, target: null };

class Point {
    constructor(x, y, pinned = false) {
        this.x = x;
        this.y = y;
        this.oldX = x;
        this.oldY = y;
        this.pinned = pinned;
    }

    update() {
        if (this.pinned) return;

        // Verlet Integration
        let vx = (this.x - this.oldX) * CONFIG.friction;
        let vy = (this.y - this.oldY) * CONFIG.friction;

        this.oldX = this.x;
        this.oldY = this.y;

        this.x += vx;
        this.y += vy;
        this.y += CONFIG.gravity; // Apply gravity
    }

    constrain() {
        if (this.pinned) return;

        // Floor collision
        if (this.y > height) {
            this.y = height;
            this.oldY = this.y + (this.y - this.oldY) * 0.5; // Bounce effect
        }
        // Wall collisions
        if (this.x > width) this.x = width;
        if (this.x < 0) this.x = 0;
    }
}

class Stick {
    constructor(p1, p2) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    resolve() {
        let dx = this.p2.x - this.p1.x;
        let dy = this.p2.y - this.p1.y;
        let distance = Math.hypot(dx, dy);
        let difference = (this.length - distance) / distance;

        // Calculate displacement
        let offsetX = dx * difference * 0.5;
        let offsetY = dy * difference * 0.5;

        if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }
}

function init() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    points = [];
    sticks = [];

    const startX = (width - CONFIG.clothWidth * CONFIG.spacing) / 2;
    const startY = 50;

    // Create Points
    for (let y = 0; y < CONFIG.clothHeight; y++) {
        for (let x = 0; x < CONFIG.clothWidth; x++) {
            // Pin the top row
            const pinned = (y === 0);
            points.push(new Point(startX + x * CONFIG.spacing, startY + y * CONFIG.spacing, pinned));
        }
    }

    // Create Sticks (Structural and Shear)
    for (let y = 0; y < CONFIG.clothHeight; y++) {
        for (let x = 0; x < CONFIG.clothWidth; x++) {
            let index = y * CONFIG.clothWidth + x;

            // Horizontal stick
            if (x < CONFIG.clothWidth - 1) {
                sticks.push(new Stick(points[index], points[index + 1]));
            }
            // Vertical stick
            if (y < CONFIG.clothHeight - 1) {
                sticks.push(new Stick(points[index], points[index + CONFIG.clothWidth]));
            }
            // Diagonal stick (Shear constraint)
            if (x < CONFIG.clothWidth - 1 && y < CONFIG.clothHeight - 1) {
                sticks.push(new Stick(points[index], points[index + CONFIG.clothWidth + 1]));
                sticks.push(new Stick(points[index + 1], points[index + CONFIG.clothWidth]));
            }
        }
    }
}

function update() {
    // Update points
    points.forEach(p => p.update());

    // Satisfy constraints multiple times for stability
    for (let i = 0; i < CONFIG.iterations; i++) {
        sticks.forEach(s => s.resolve());
        points.forEach(p => p.constrain());
    }

    // Mouse interaction
    if (mouse.down && mouse.target) {
        mouse.target.x = mouse.x;
        mouse.target.y = mouse.y;
        // To prevent the "snapping" effect, we sync old position to current 
        // so it doesn't gain infinite velocity when released.
        mouse.target.oldX = mouse.x;
        mouse.target.oldY = mouse.y;
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw Sticks
    ctx.beginPath();
    ctx.strokeStyle = '#55acee';
    ctx.lineWidth = 1;
    for (let s of sticks) {
        // Optimization: Only draw structural sticks for cleaner look, 
        // or draw all for a mesh effect. Let's draw all but with low alpha.
        ctx.moveTo(s.p1.x, s.p1.y);
        ctx.lineTo(s.p2.x, s.p2.y);
    }
    ctx.stroke();

    // Draw Points (optional, for debugging)
    /*
    ctx.fillStyle = 'white';
    for (let p of points) {
        ctx.fillRect(p.x-1, p.y-1, 2, 2);
    }
    */
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Input Handling
window.addEventListener('mousedown', (e) => {
    mouse.down = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // Find nearest point
    let minDist = CONFIG.mouseRadius;
    mouse.target = null;

    for (let p of points) {
        let d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
        if (d < minDist) {
            minDist = d;
            mouse.target = p;
        }
    }
});

window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener('mouseup', () => {
    mouse.down = false;
    mouse.target = null;
});

window.addEventListener('resize', init);

// Start Simulation
init();
loop();

</script>
</body>
</html>
