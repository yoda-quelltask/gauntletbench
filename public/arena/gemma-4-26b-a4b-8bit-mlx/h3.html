<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Drive - Parallax Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let frame = 0;

// Configuration
const CONFIG = {
    carSpeed: 5,
    parallaxLayers: [
        { name: 'mountains', speed: 0.1, color: '#2a1b3d' },
        { name: 'hills', speed: 0.4, color: '#3d2b56' },
        { name: 'trees', speed: 1.2, color: '#1a2e1a' },
        { name: 'road', speed: 6.0, color: '#1a1a1a' }
    ]
};

// State management
let offset = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

// --- Helper Classes ---

class Cloud {
    constructor() {
        this.reset();
        this.x = Math.random() * width; // Randomize initial start position
    }
    reset() {
        this.x = width + 200;
        this.y = Math.random() * (height * 0.3);
        this.speed = 0.2 + Math.random() * 0.5;
        this.size = 30 + Math.random() * 50;
        this.opacity = 0.3 + Math.random() * 0.4;
    }
    update() {
        this.x -= this.speed;
        if (this.x < -200) this.reset();
    }
    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.arc(this.x + this.size * 0.6, this.y - this.size * 0.3, this.size * 0.8, 0, Math.PI * 2);
        ctx.arc(this.x + this.size * 1.2, this.y, this.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Bird {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = width + 100;
        this.y = Math.random() * (height * 0.4);
        this.speed = 1 + Math.random() * 2;
        this.wingSpeed = 0.1 + Math.random() * 0.2;
        this.wingAngle = 0;
    }
    update() {
        this.x -= this.speed;
        this.wingAngle += this.wingSpeed;
        if (this.x < -50) this.reset();
    }
    draw() {
        const wingY = Math.sin(this.wingAngle) * 5;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Simple V shape for bird
        ctx.moveTo(this.x - 10, this.y + wingY);
        ctx.lineTo(this.x, this.y);
        ctx.lineTo(this.x + 10, this.y + wingY);
        ctx.stroke();
    }
}

// --- Scenery Generators ---

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#0f0c29'); // Deep night blue
    grad.addColorStop(0.4, '#302b63'); // Purple dusk
    grad.addColorStop(0.7, '#ff8c00'); // Sunset orange
    grad.addColorStop(1, '#ff4500');   // Horizon glow
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Sun/Moon glow
    const sunGrad = ctx.createRadialGradient(width * 0.8, height * 0.2, 10, width * 0.8, height * 0.2, 300);
    sunGrad.addColorStop(0, 'rgba(255, 200, 100, 0.4)');
    sunGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, width, height);
}

function drawMountains(xOffset) {
    ctx.fillStyle = '#2a1b3d';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.7);
    for (let i = 0; i <= width + 100; i += 50) {
        // Use sine waves to create mountain peaks
        const peak = Math.sin((i + xOffset * 0.1) * 0.005) * 100 + Math.cos((i + xOffset * 0.1) * 0.01) * 50;
        ctx.lineTo(i, height * 0.7 - peak);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
}

function drawHills(xOffset) {
    ctx.fillStyle = '#3d2b56';
    ctx.beginPath();
    ctx.moveTo(0, height * 0.8);
    for (let i = 0; i <= width + 100; i += 40) {
        const peak = Math.sin((i + xOffset * 0.4) * 0.01) * 60 + 50;
        ctx.lineTo(i, height * 0.8 - peak);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
}

function drawTreesAndPoles(xOffset) {
    // We use a modulo to loop the scenery
    const spacing = 300;
    const startX = -(xOffset % spacing);

    for (let x = startX; x < width + spacing; x += spacing) {
        // Draw a pole
        ctx.fillStyle = '#222';
        ctx.fillRect(x + 50, height * 0.6, 10, height * 0.3);
        ctx.fillRect(x + 40, height * 0.65, 30, 5);

        // Draw a tree
        ctx.fillStyle = '#1a2e1a';
        ctx.beginPath();
        ctx.moveTo(x + 150, height * 0.8);
        ctx.lineTo(x + 200, height * 0.4);
        ctx.lineTo(x + 250, height * 0.8);
        ctx.fill();
    }
}

function drawRoad(xOffset) {
    // Ground/Road base
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, height * 0.8, width, height * 0.2);

    // Road Markings
    // IMPORTANT: To simulate forward motion, markings must move LEFT (negative direction)
    const dashWidth = 60;
    const gapWidth = 40;
    const totalStep = dashWidth + gapWidth;
    
    ctx.fillStyle = '#f1c40f'; // Yellow road line
    const dashX = -(xOffset % totalStep);

    for (let x = dashX - totalStep; x < width + totalStep; x += totalStep) {
        ctx.fillRect(x, height * 0.85, dashWidth, 10);
    }

    // Side lines (white)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, height * 0.8, 15, height * 0.2);
    ctx.fillRect(width - 15, height * 0.8, 15, height * 0.2);
}

// --- The Car ---

class Car {
    constructor() {
        this.x = width * 0.25;
        this.y = height * 0.8;
        this.wheelRotation = 0;
    }

    update() {
        // Subtle body bounce (suspension)
        this.bounce = Math.sin(frame * 0.2) * 2;
        // Wheel rotation based on speed
        this.wheelRotation += 0.15;
    }

    draw() {
        const carY = this.y + this.bounce;
        const carX = this.x;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(carX + 80, this.y + 15, 90, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Car Body (Stylized Silhouette)
        ctx.fillStyle = '#333'; // Dark car body
        // Main chassis
        ctx.beginPath();
        ctx.roundRect(carX, carY - 40, 160, 45, [20, 50, 10, 10]);
        ctx.fill();

        // Cabin/Windows
        ctx.fillStyle = '#556'; 
        ctx.beginPath();
        ctx.moveTo(carX + 40, carY - 40);
        ctx.lineTo(carX + 70, carY - 75);
        ctx.lineTo(carX + 130, carY - 75);
        ctx.lineTo(carX + 150, carY - 40);
        ctx.closePath();
        ctx.fill();

        // Highlight on window
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Wheels
        this.drawWheel(carX + 35, carY);
        this.drawWheel(carX + 125, carY);
    }

    drawWheel(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.wheelRotation);

        // Tire
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();

        // Rim/Spokes to show rotation
        ctx.strokeStyle = '#777';
        ctx.lineWidth = 3;
        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -20);
            ctx.stroke();
            ctx.rotate(Math.PI / 3);
        }

        // Center cap
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// --- Main Loop ---

const car = new Car();
const clouds = Array.from({ length: 6 }, () => new Cloud());
const birds = Array.from({ length: 3 }, () => new Bird());

function animate() {
    frame++;
    // Increment global offset to drive parallax
    offset += CONFIG.carSpeed;

    ctx.clearRect(0, 0, width, height);

    // 1. Sky & Atmosphere
    drawSky();

    // 2. Distant Layers (Slowest)
    clouds.forEach(c => { c.update(); c.draw(); });
    birds.forEach(b => { b.update(); b.draw(); });
    drawMountains(offset);

    // 3. Mid Layers
    drawHills(offset);
    drawTreesAndPoles(offset);

    // 4. Foreground Layers (Fastest)
    drawRoad(offset);

    // 5. The Subject
    car.update();
    car.draw();

    requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
